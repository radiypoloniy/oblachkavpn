name: Сборка и релиз

# Тег vX.Y.Z — сборка, проверки, установщик и релиз на GitHub с описанием из CHANGELOG.md.
# Тег vX.Y.Z-rc.N — то же, но пробная версия (pre-release): обновлялка её не видит
# (AppUpdate берёт releases/latest), ставится вручную. Проверили — тот же коммит тегом vX.Y.Z.
# Ручной запуск (Actions → Run workflow) — то же без релиза: установщик остаётся артефактом.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      # Ядро туннеля oblachka-core собирается из core\ (scripts\build-core.ps1) и сверяется
      # с закреплённым SHA256: тот же Go из core\go.mod даёт тот же файл.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Inno Setup
        run: choco install innosetup -y --no-progress

      # Встроенные команды с кириллицей — в PowerShell 7: Windows PowerShell 5.1 читает их
      # временный файл без BOM в кодировке ANSI, и русские строки ломают разбор.
      - name: Версия тега совпадает с версией в коде
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = ([xml](Get-Content src\Oblachka.csproj -Raw)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ('${{ github.ref_name }}' -notmatch ('^v' + [regex]::Escape($version) + '(-rc\.\d+)?$')) { throw ('Тег ${{ github.ref_name }}, а в Oblachka.csproj версия ' + $version) }
          if (-not (Select-String -Path src\App\ServiceBrand.cs -SimpleMatch ('Version = "' + $version + '"'))) { throw 'ServiceBrand.Version не совпадает с Oblachka.csproj' }

      - name: Сборка
        shell: powershell
        run: .\build.ps1

      - name: Проверки
        shell: powershell
        run: .\test.ps1

      - name: Установщик
        shell: powershell
        run: .\build-installer.ps1

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer
          path: dist/Oblachka-setup-*.exe
          if-no-files-found: error

      - name: Релиз
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = Get-ChildItem dist\Oblachka-setup-*.exe | Select-Object -First 1
          .\scripts\release-notes.ps1 -Tag '${{ github.ref_name }}' -Installer $setup.FullName -Output notes.md
          $tag = '${{ github.ref_name }}'
          $version = $tag.TrimStart('v')
          if ($tag -match '-rc\.(\d+)$') {
            gh release create $tag $setup.FullName --title ('Облачка ' + ($version -split '-')[0] + ' — проба ' + $Matches[1]) --notes-file notes.md --prerelease
          } else {
            gh release create $tag $setup.FullName --title ('Облачка ' + $version) --notes-file notes.md
          }
          if ($LASTEXITCODE -ne 0) { throw 'Релиз не создан.' }
